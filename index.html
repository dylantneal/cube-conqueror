<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rubix Solver</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="top">
      <h1>Rubix Solver</h1>
      <p class="hint" id="hint"></p>
    </header>

    <div id="stage"></div>

    <footer class="controls">
      <div class="panel" id="play-panel">
        <div class="moves" id="moves"></div>
        <div class="actions">
          <button id="solve" class="primary">Solve</button>
          <button id="enter">Enter my cube</button>
          <button id="scramble">Scramble</button>
          <button id="undo">Undo</button>
          <button id="reset">Reset</button>
        </div>
      </div>
      <div class="panel" id="paint-panel" hidden>
        <div class="palette" id="palette"></div>
        <div class="actions">
          <button id="check" class="primary">Check my cube</button>
          <button id="clear">Clear</button>
          <button id="cancel">Cancel</button>
        </div>
      </div>
      <div class="panel" id="guide-panel" hidden>
        <div class="step-card" aria-live="polite">
          <p class="step-stage" id="step-stage"></p>
          <p class="step-count" id="step-count"></p>
          <p class="step-move" id="step-move"></p>
          <p class="step-text" id="step-text"></p>
          <p class="step-tip" id="step-tip">Clockwise means as you look straight at that face. The arrow on the cube shows the turn.</p>
          <div class="why">
            <p class="step-why" id="step-why"></p>
            <p class="stage-intro" id="stage-intro" hidden></p>
            <button class="link" id="about-stage" aria-controls="stage-intro">How does this stage work?</button>
          </div>
          <div class="meters" id="meters"></div>
        </div>
        <ol class="move-strip" id="move-strip"></ol>
        <div class="actions guide-actions">
          <button id="back">Back</button>
          <button id="next" class="primary">Next</button>
        </div>
        <div class="actions">
          <button id="show" class="quiet">Show me this move</button>
          <button id="exit" class="quiet">Exit</button>
        </div>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
